<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / iPhone -->
    <link rel="manifest" href="/manifest.json" id="pwa-manifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emilian Leber" id="pwa-title" />
    <script>
      // On the admin subdomain, switch to the CRM manifest + title
      if (window.location.hostname === 'admin.magicel.de') {
        document.getElementById('pwa-manifest').setAttribute('href', '/admin-manifest.json');
        document.getElementById('pwa-title').setAttribute('content', 'CRM');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0a');
      }
    </script>

    <!-- Favicon (Karten-Logo) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect zu kritischen externen Origins (Core Web Vitals: LCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://rjhvqctjtgfpxzhnrozt.supabase.co" />

    <!-- Hero-Font preload (LCP-Optimierung) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'" />

    <!-- SEO -->
    <title>Emilian Leber – Zauberer für Events, Firmenfeiern & Hochzeiten</title>
    <meta name="description" content="Emilian Leber begeistert als moderner Zauberer auf Hochzeiten, Firmenfeiern und Events. Einzigartige Shows voller Humor und Staunen." />
    <meta name="author" content="Emilian Leber" />
    <link rel="canonical" href="https://www.magicel.de/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.magicel.de/" />
    <meta property="og:title" content="Emilian Leber – Zauberer für Events, Firmenfeiern & Hochzeiten" />
    <meta property="og:description" content="Moderner Zauberer für Events, Firmenfeiern und Hochzeiten. Interaktive Shows voller Humor und Staunen." />
    <meta property="og:image" content="https://www.magicel.de/hero-magic.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emilian Leber – Zauberer für Events & Hochzeiten" />
    <meta name="twitter:description" content="Moderner Zauberer für Events, Firmenfeiern und Hochzeiten." />
    <meta name="twitter:image" content="https://www.magicel.de/hero-magic.jpg" />

    <!-- JSON-LD wird beim Build pro Route in den <head> injiziert
         (scripts/inject-meta.mjs + scripts/seo-content.mjs) — Single Source,
         genau EINE aggregateRating pro Seite (auf LocalBusiness).
         Die client-seitigen <script ld+json> der Page-Komponenten sind aktuell
         wirkungslos (react-helmet-async@3 rendert keine <script>-Tags); falls
         Helmet je gefixt/ersetzt wird, dort JSON-LD entfernen — sonst doppelte
         aggregateRating (GSC-Fehler "Review hat mehrere Bewertungen"). -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="padding:32px;text-align:center;font-family:system-ui,sans-serif;">
        Diese Seite benötigt JavaScript. Bitte aktiviere JavaScript im Browser
        oder kontaktiere mich direkt: <a href="mailto:el@magicel.de">el@magicel.de</a>
      </p>
    </noscript>
  </body>
</html>
